- name: Create dedicated Ansible deployment user
  hosts: all
  become: true
  vars:
    target_deploy_user: "{{ lookup('ansible.builtin.ini', 'target_deploy_user', type='properties', file=playbook_dir ~ '/../../.env') | default('ansible_user', true) }}"

  tasks:
    - name: Debug msg
      ansible.builtin.debug:
        msg: "Ansible is now creating {{ target_deploy_user }} on the server."

    - name: Ensure the '{{ target_deploy_user }}' group exists
      ansible.builtin.group:
        name: "{{ target_deploy_user }}"
        state: present

    - name: Create the '{{ target_deploy_user }}' account
      ansible.builtin.user:
        name: "{{ target_deploy_user }}"
        shell: /bin/bash
        group: "{{ target_deploy_user }}"
        groups: sudo
        append: true
        state: present

    - name: Deploy all local public SSH keys to the new user
      ansible.posix.authorized_key:
            user: "{{ target_deploy_user }}"
            state: present
            key: "{{ lookup('file', item) }}"
      with_fileglob:
            - "~/.ssh/*.pub"

    - name: Allow '{{ target_deploy_user }}' to use sudo without a password prompt
      ansible.builtin.lineinfile:
        path: "/etc/sudoers.d/{{ target_deploy_user }}"
        line: "{{ target_deploy_user }} ALL=(ALL) NOPASSWD:ALL"
        validate: "visudo -cf %s"
        create: true
        mode: '0440'